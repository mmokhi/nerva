name: ci/gh-actions/depends

on:
    push:
        branches:
            - master
        paths-ignore:
            - 'docs/**'
            - '**/README.md'
    pull_request:
        paths-ignore:
            - 'docs/**'
            - '**/README.md'
    schedule:
        -   cron: '0 6 * * 1,4'
    workflow_dispatch:

env:
    APT_SET_CONF: |
        tee -a /etc/apt/apt.conf.d/80-custom << EOF
        Acquire::Retries "3";
        Acquire::http::Timeout "120";
        Acquire::ftp::Timeout "120";
        EOF
    CCACHE_SETTINGS: |
        ccache --max-size=500M
        ccache --set-config=compression=true

jobs:
    build-cross:
        # The actions (checkout, cache, upload-artifact) run directly on the
        # GitHub-hosted runner so their Node 20 toolchain works. The actual
        # `make depends` build runs inside a Ubuntu 18.04 docker container,
        # which pins the produced Linux binaries' glibc symbol floor at 2.27
        # so nerva-linux-armv8 (and its siblings) actually load on Jetson Nano
        # JetPack 4.x and similar ARMv8 boards still on 18.04.
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                toolchain:
                    -   name: "ARM v7"
                        host: "arm-linux-gnueabihf"
                        packages: "python3 gperf g++-arm-linux-gnueabihf"
                        artifact-name: "nerva-linux-armv7"
                    -   name: "ARM v8"
                        host: "aarch64-linux-gnu"
                        packages: "python3 gperf g++-aarch64-linux-gnu"
                        artifact-name: "nerva-linux-armv8"
                    -   name: "i686 Win"
                        host: "i686-w64-mingw32"
                        packages: "python3 g++-mingw-w64-i686"
                        artifact-name: "nerva-windows-x32"
                    -   name: "i686 Linux"
                        host: "i686-pc-linux-gnu"
                        packages: "gperf cmake g++-multilib python3-zmq"
                        artifact-name: "nerva-linux-i686"
                    -   name: "Win64"
                        host: "x86_64-w64-mingw32"
                        packages: "cmake python3 g++-mingw-w64-x86-64"
                        artifact-name: "nerva-windows-x64"
                    -   name: "x86_64 Linux"
                        host: "x86_64-unknown-linux-gnu"
                        packages: "gperf cmake python3-zmq libdbus-1-dev libharfbuzz-dev"
                        artifact-name: "nerva-linux-x86_64"
                    -   name: "Cross-Mac x86_64"
                        host: "x86_64-apple-darwin"
                        packages: "cmake imagemagick libcap-dev librsvg2-bin libz-dev libbz2-dev libtiff-tools python-dev python3-setuptools-git libtinfo5"
                        artifact-name: "nerva-macos-x64"
                    -   name: "Cross-Mac aarch64"
                        host: "aarch64-apple-darwin"
                        packages: "cmake imagemagick libcap-dev librsvg2-bin libz-dev libbz2-dev libtiff-tools python-dev python3-setuptools-git libtinfo5"
                        artifact-name: "nerva-macos-armv8"
                    -   name: "x86_64 Freebsd"
                        host: "x86_64-unknown-freebsd"
                        packages: "clang-8 gperf cmake python3-zmq libdbus-1-dev libharfbuzz-dev"
                        artifact-name: "nerva-freebsd-x86_64"
                    -   name: "ARMv8 Android"
                        host: "aarch64-linux-android"
                        # python-is-python3 is installed by the build container's
                        # bash script below (not here) because it doesn't exist
                        # on ubuntu:18.04, and the matrix-level apt install must
                        # succeed atomically.
                        packages: "gperf cmake python3 unzip"
                        artifact-name: "nerva-android-armv8"
        name: ${{ matrix.toolchain.name }}
        steps:
            -   uses: actions/checkout@v6
                with:
                    fetch-depth: 0
                    submodules: recursive
            -   name: Ccache
                uses: actions/cache@v5
                with:
                    path: ~/.ccache
                    key: ccache-${{ matrix.toolchain.host }}-${{ github.sha }}
                    restore-keys: ccache-${{ matrix.toolchain.host }}-
            -   name: Depends cache
                uses: actions/cache@v5
                with:
                    path: contrib/depends/built
                    key: depends-${{ matrix.toolchain.host }}-${{ hashFiles('contrib/depends/packages/*') }}
                    restore-keys: |
                        depends-${{ matrix.toolchain.host }}-${{ hashFiles('contrib/depends/packages/*') }}
                        depends-${{ matrix.toolchain.host }}-
            -   uses: ./.github/actions/set-make-job-count
            -   name: Build inside ubuntu:18.04 container
                # The workspace and ccache state are bind-mounted into the
                # container so caches persist across runs and artifacts are
                # visible to the host runner for upload-artifact afterwards.
                run: |
                    mkdir -p ~/.ccache
                    docker run --rm \
                        -v "${{ github.workspace }}:/work" \
                        -v "$HOME/.ccache:/root/.ccache" \
                        -w /work \
                        -e DEBIAN_FRONTEND=noninteractive \
                        -e CCACHE_TEMPDIR=/tmp/.ccache-temp \
                        -e MAKE_JOB_COUNT="${MAKE_JOB_COUNT}" \
                        -e HOST_TARGET="${{ matrix.toolchain.host }}" \
                        -e EXTRA_APT_PACKAGES="${{ matrix.toolchain.packages }}" \
                        ubuntu:18.04 \
                        bash -eux -c '
                            { echo "Acquire::Retries \"3\";";
                              echo "Acquire::http::Timeout \"120\";";
                              echo "Acquire::ftp::Timeout \"120\";";
                            } >> /etc/apt/apt.conf.d/80-custom

                            apt update
                            apt -y install build-essential libtool cmake autotools-dev automake pkg-config bsdmainutils curl git ca-certificates ccache ${EXTRA_APT_PACKAGES}

                            # The Android NDK build glue calls /usr/bin/python
                            # expecting python3. Use the standard packaging
                            # mechanism where it is available (Ubuntu 20.04+),
                            # fall back to creating the symlink by hand on
                            # 18.04 where python-is-python3 is not packaged.
                            # NB: avoid apostrophes anywhere inside this block;
                            # the surrounding bash -c uses single quotes and
                            # there is no way to escape a literal "\x27" inside
                            # a single-quoted bash string.
                            if [ "${HOST_TARGET}" = "aarch64-linux-android" ]; then
                                apt -y install python-is-python3 2>/dev/null \
                                    || ln -sf /usr/bin/python3 /usr/bin/python
                            fi

                            git config --global --add safe.directory "*"

                            if [ "${HOST_TARGET}" = "x86_64-w64-mingw32" ] || [ "${HOST_TARGET}" = "i686-w64-mingw32" ]; then
                                update-alternatives --set "${HOST_TARGET}-g++" "$(which ${HOST_TARGET}-g++-posix)"
                                update-alternatives --set "${HOST_TARGET}-gcc" "$(which ${HOST_TARGET}-gcc-posix)"
                            fi

                            ccache --max-size=150M
                            ccache --set-config=compression=true

                            make depends target="${HOST_TARGET}" -j"${MAKE_JOB_COUNT}"
                        '
            -   uses: actions/upload-artifact@v7
                if: github.event_name != 'schedule'
                with:
                    name: ${{ matrix.toolchain.artifact-name }}
                    path: |
                        build/${{ matrix.toolchain.host }}/release/bin/nerva*
